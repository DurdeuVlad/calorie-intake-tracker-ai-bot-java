name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify
      - name: Build container
        run: docker build --tag food-journal:${{ github.sha }} .
      - name: Compose smoke test
        env:
          DATABASE_PASSWORD: ci-password
          TELEGRAM_BOT_TOKEN: ci-token-not-a-secret
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
          ALLOWED_TELEGRAM_USER_IDS: '1'
          OPENAI_API_KEY: ci-openai-key
          OPEN_FOOD_FACTS_BASE_URL: https://world.openfoodfacts.org/api/v2
        run: |
          docker compose config | grep -q 'OPENAI_API_KEY: ci-openai-key'
          docker compose up --build --detach
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health && docker compose exec -T app sh -c 'wget -q -O - "http://localhost:${MANAGEMENT_PORT}/actuator/health/readiness"'; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Compose cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
